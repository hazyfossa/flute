[package]
name = "flute"
version = "0.1.0"
edition = "2024"

[dependencies]
dynosaur = { version = "0.3.0", optional = true }
futures-util = { version = "0.3.31", optional = true, default-features = false, features = ["std", "sink"] }
kanal = { version = "0.1.1", optional = true }
postcard = { version = "1.1.3", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", optional = true }
snafu = "0.8.9"

[features]
dyn = ["dep:dynosaur"]

futures = ["dep:futures-util"]
kanal = ["dep:kanal"]

data-json = ["dep:serde_json"]
data-postcard = ["dep:postcard"]


