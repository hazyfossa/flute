[package]
name = "flute"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = { version = "0.3.31", optional = true, default-features = false, features = [
    "std",
    "sink",
] }
kanal = { version = "0.1.1", optional = true }
postcard = { version = "1.1.3", optional = true, features = ["use-std"] }
serde_json = { version = "1.0.149", optional = true }
tokio = { version = "1.50", optional = true }
gloo-net = { version = "0.6.0", optional = true, default-features = false, features = [
    "http",
    "websocket",
] }
axum = { version = "0.8.8", optional = true }
tower-service = { version = "0.3.3", optional = true }

eyre = { version = "0.6.12", default-features = false }
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
yoke = { version = "0.8.3", features = ["derive"] }
stable_deref_trait = "1.2.1"
bytes = { version = "1.12.0", optional = true }
hazymacros = { version = "0.1.0", path = "../hazymacros" }


[features]
examples = [
    "dep:axum",
    "dep:tokio",
    "tokio/full",
    "futures",
    "kanal",
    "data-json",
]

futures = ["dep:futures-util"]
kanal = ["dep:kanal"]
wasm = ["dep:gloo-net"]
tower = ["dep:tower-service"]
bytes = ["dep:bytes"]
tokio = ["dep:tokio", "bytes"]

data-json = ["dep:serde_json"]
data-postcard = ["dep:postcard"]

fast-server = ["dep:tokio"]
unstable-split-any = ["futures", "futures-util/unstable", "futures-util/bilock"]
